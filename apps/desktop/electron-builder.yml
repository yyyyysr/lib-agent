appId: edu.yiyeshuzhan.desktop
productName: 一页书展
executableName: YiyeShuzhan
copyright: Copyright © 2026 一页书展团队
directories:
  output: release/${version}
  buildResources: build
files:
  - out/**/*
  - package.json
  - '!**/*.map'
asar: true
# 所有依赖都是 devDependencies 且已由 electron-vite 打包进 out/，安装包不携带 node_modules，也无原生模块需要重编译
npmRebuild: false
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  # 修改 fuse 会使 Electron 二进制原签名失效；Apple Silicon 拒绝运行无签名程序，未配置证书时需重新做 ad-hoc 签名
  resetAdHocDarwinSignature: true

mac:
  category: public.app-category.education
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  artifactName: YiyeShuzhan-${version}-mac-${arch}.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false
  # 签名与公证通过 CI 环境变量 CSC_LINK / APPLE_ID 等提供；未提供时生成未签名包
  notarize: false
dmg:
  title: 一页书展 ${version}

win:
  target:
    - target: nsis
      arch: [x64, arm64]
  artifactName: YiyeShuzhan-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: 一页书展
  uninstallDisplayName: 一页书展

linux:
  target: [AppImage]
  category: Education
