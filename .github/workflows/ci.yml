name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 检查 · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 下载 Electron
        run: pnpm --filter @yys/desktop exec install-electron

      - name: 类型检查
        run: pnpm typecheck

      - name: 单元测试
        run: pnpm test

      - name: 构建
        run: pnpm build && pnpm server:build

      - name: E2E 全流程测试
        run: pnpm --filter @yys/desktop exec playwright test

      - name: 上传界面截图（用于双平台一致性比对）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.os }}
          path: apps/desktop/e2e-results
          retention-days: 14

      - name: 打包冒烟（不签名）
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm sample:covers && pnpm --filter @yys/desktop exec electron-builder --dir --publish never

      - name: 打包产物启动检查
        run: node apps/desktop/scripts/smoke-packaged.mjs
