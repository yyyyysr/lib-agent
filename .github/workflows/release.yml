name: Release

# 在 GitHub 上发布 Release（如 v0.4.0）后自动打包 macOS 与 Windows 安装包并附加到该 Release；
# 也可在 Actions 页面手动运行，产物保存为构建附件。
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS（arm64 + x64）
            os: macos-latest
            script: dist:mac
            files: |
              apps/desktop/release/*/*.dmg
          - name: Windows（x64 + arm64）
            os: windows-latest
            script: dist:win
            files: |
              apps/desktop/release/*/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 打包
        shell: bash
        env:
          # 在仓库 Secrets 中配置证书后自动签名（macOS 另需 Apple ID 用于公证）；未配置时生成未签名包
          CSC_LINK: ${{ matrix.os == 'macos-latest' && secrets.MAC_CSC_LINK || secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.MAC_CSC_KEY_PASSWORD || secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CSC_LINK" ]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; fi
          pnpm --filter @yys/desktop ${{ matrix.script }}
      - name: 检查打包后的应用能否启动
        run: node apps/desktop/scripts/smoke-packaged.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error
      - name: 附加到 Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: ${{ matrix.files }}
